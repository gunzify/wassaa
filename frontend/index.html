    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      // Resolve the theme before first paint so dark mode never flashes cream.
      try {
        var pref = localStorage.getItem('wassaa_theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePreference = pref;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) chrome.setAttribute('content', dark ? '#131110' : '#B85A3C');
      } catch (e) { /* private browsing: fall back to the light palette */ }
    </script>
  </head>
  <body class="bg-[#F7F5F0] text-[#1A1816] antialiased selection:bg-[#B85A3C] selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
